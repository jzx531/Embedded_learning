[Service]
# RK3568 vendor GLES/Mali EGL produces a black GNOME compositor on physical Xorg.
# Limit this workaround to GNOME Shell, retaining the board's Xorg/DRM drivers.
UnsetEnvironment=COGL_DRIVER LD_PRELOAD
Environment=LIBGL_ALWAYS_SOFTWARE=1
Environment=GALLIUM_DRIVER=llvmpipe
Environment=__GLX_VENDOR_LIBRARY_NAME=mesa
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
Environment=LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu
